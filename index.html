    <!-- Instant Theme Initializer (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('signvalid-theme');
          var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0B0F17');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
